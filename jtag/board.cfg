# Tang Primer 20K Dock BL702 FT2232-compatible USB-JTAG, channel A.
adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
ftdi channel 0
ftdi layout_init 0x0008 0x000b
adapter speed 6000
transport select jtag
reset_config none

# The Gowin TAP uses an 8-bit instruction register, not the default 5 bits.
jtag newtap gowin tap -irlen 8 -ircapture 0x01 -irmask 0x03 -expected-id 0x0000081b

# This is a one-shot command-line example, not a debug server.
gdb_port disabled
tcl_port disabled
telnet_port disabled
